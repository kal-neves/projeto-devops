services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      kind:
        aliases: [devops-elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://devops-elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    networks: [kind]
    depends_on: [elasticsearch]
volumes:
  es-data:
networks:
  kind:
    external: true
